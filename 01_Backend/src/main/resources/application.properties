server.port=8080

# DataSource Configuration (Defaults to embedded persistent MySQL-mode store for immediate run without setup friction)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/college_event_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3e5b7a1f6c8d2e4a7b9c1d3e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin Seed Account
app.admin.email=admin440@gmail.com
app.admin.password=1234567
app.admin.name=System Administrator
